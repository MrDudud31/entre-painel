<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Entre · Painel</title>
  <meta name="theme-color" content="#163A32">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Entre">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <!-- Aplica o estilo escolhido antes de desenhar a tela (sem "piscar" no estilo padrão) -->
  <script>try { var s = localStorage.getItem('entre.painel.style'); if (s) document.documentElement.dataset.style = s; } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Primeira carga (some quando o painel abre; vira aviso de erro se faltar internet) -->
  <section id="boot" class="screen"><div class="boot-logo"><span class="logo-badge"><svg class="entre-logo loop" viewBox="26 16 68 70" aria-hidden="true"><path class="b" d="M30 70 V34 A14 14 0 0 1 44 20 H76 A14 14 0 0 1 90 34 V56 A14 14 0 0 1 76 70 H48 L34 82 Z"/><circle class="d" cx="47" cy="45" r="5"/><circle class="d" cx="60" cy="45" r="5"/><circle class="d" cx="73" cy="45" r="5"/></svg></span><p class="loading">Carregando…</p></div></section>

  <!-- Entrar -->
  <section id="login" class="screen" hidden>
    <form id="loginForm" class="card narrow">
      <div class="brand"><span class="logo-badge"><svg class="entre-logo anim" viewBox="26 16 68 70" aria-hidden="true"><path class="b" d="M30 70 V34 A14 14 0 0 1 44 20 H76 A14 14 0 0 1 90 34 V56 A14 14 0 0 1 76 70 H48 L34 82 Z"/><circle class="d" cx="47" cy="45" r="5"/><circle class="d" cx="60" cy="45" r="5"/><circle class="d" cx="73" cy="45" r="5"/></svg></span><div><b>Entre</b><small>Painel da secretária de WhatsApp</small></div></div>
      <label>E-mail<input name="email" type="email" autocomplete="username" required></label>
      <label>Senha<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary block" type="submit">Entrar</button>
      <p class="hint">Esqueceu a senha? Fale com a equipe Entre pelo WhatsApp.</p>
      <p id="loginError" class="error" role="alert"></p>
    </form>
  </section>

  <!-- Primeiro acesso: cadastrar o negócio -->
  <section id="onboard" class="screen" hidden></section>

  <!-- Painel -->
  <div id="main" hidden>
    <header class="top">
      <div class="top-brand"><span id="bizMark"></span><div class="top-title"><small id="bizKind"></small><h1 id="bizName"></h1></div></div>
      <button id="botPill" class="pill" type="button"></button>
    </header>
    <main id="view" aria-live="polite"></main>
    <nav class="tabs" aria-label="Seções">
      <button data-tab="inicio" type="button"><svg viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1z"/></svg><span>Início</span><i class="badge" id="badgeInicio" hidden></i></button>
      <button data-tab="agenda" type="button"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>Agenda</span></button>
      <button data-tab="conversas" type="button"><svg viewBox="0 0 24 24"><path d="M5 6h14v10h-9l-5 4z"/></svg><span>Conversas</span><i class="badge" id="badgeConversas" hidden></i></button>
      <button data-tab="clientes" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.5"/><path d="M5 20c1.2-3.5 4-5 7-5s5.8 1.5 7 5"/></svg><span>Clientes</span></button>
      <button data-tab="ajustes" type="button"><svg viewBox="0 0 24 24"><path d="M5 7h9M18 7h1M5 17h3M12 17h7"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Ajustes</span></button>
    </nav>
  </div>

  <dialog id="sheet"></dialog>
  <div id="toast" class="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
